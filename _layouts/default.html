<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>
  <body class="page-{{ page.layout | default: 'default' }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
    <div class="site-shell">
      <header class="site-header">
        <div class="site-header__inner">
          <a class="brand" href="{{ '/' | relative_url }}">
            <span class="brand__mark">WS</span>
            <span class="brand__text">Willian Soncini</span>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a class="site-nav__link{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
            <a class="site-nav__link{% if page.url == '/resume/' %} is-active{% endif %}" href="{{ '/resume/' | relative_url }}">PT</a>
            <a class="site-nav__link{% if page.url == '/resume_en/' %} is-active{% endif %}" href="{{ '/resume_en/' | relative_url }}">EN</a>
            <a class="site-nav__link site-nav__link--external" href="https://www.linkedin.com/in/willian-soncini-783b18160/" target="_blank" rel="noreferrer">LinkedIn</a>
            <a class="site-nav__link site-nav__link--external" href="https://github.com/williansoncini" target="_blank" rel="noreferrer">GitHub</a>
          </nav>
        </div>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <p>Senior Data Engineer focused on data platforms, analytics automation, and internal products.</p>
          <div class="site-footer__links">
            <a href="https://www.linkedin.com/in/willian-soncini-783b18160/" target="_blank" rel="noreferrer">LinkedIn</a>
            <a href="https://github.com/williansoncini" target="_blank" rel="noreferrer">GitHub</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
